# The frontiers of the Africa atlas, as they lie on the ground (lon, lat).
#
# Africa carries Europe, so its frontiers are drawn the way Europe's are: along great rivers
# (the Congo is this map's Rhine, the Zambezi its Danube), along watersheds and crests (the
# desert's edge is the Alpine frontier of the Italy of the Niger), and through dune seas and
# lakes. None is a meridian, a parallel or a partition line. Each frontier is a chain of legs
# (see cgvideo/frontiers.py):
#   river:  follow the named Natural Earth river(s) to a point on them
#   divide: follow the rim of a river basin, as GRASS r.watershed computes it in QGIS
#   via:    a smooth curve through points set along an escarpment, a crest or a lake
# `nations` names the two sides; `follows` is what the frontier is, in words.
# To move a frontier: edit it here, then re-bake in QGIS with
# integrations/qgis/cg_frontiers.py (it writes africa-frontiers.geojson, which the build reads).

nodes:
  # the north
  moulouya_mouth: [-2.25, 35.22]
  draa_saguia: [-8.95, 28.52]            # where Saguia's frontier meets the Draa
  saguia_corner: [-9.25, 26.45]          # Saguia, Mauritania, Algeria
  tunisia_corner: [9.55, 31.55]          # Tunisia, Algeria, Libya
  djouf: [-5.35, 18.7]                   # Mauritania, Algeria, Mali
  ifoghas: [0.85, 19.55]                 # Mali, Algeria, Air
  central: [11.25, 23.05]                # Algeria, Libya, Air, Kanem: the Tummo and the Djado
  uweinat: [25.0, 21.95]                 # Jebel Uweinat: Libya, Egypt, Sudan
  libya_sudan: [23.7, 20.85]             # Libya, Kanem, Sudan
  # the west
  karakoro: {at: [-12.1, 14.9], river: [Sénégal, Bafing]}        # Jolof, Mauritania, Mali
  bafing_fouta: {at: [-11.05, 12.25], river: [Sénégal, Bafing]}  # Jolof, Fouta Djallon, Mali
  gambia_fouta: {at: [-12.45, 12.45], river: Gambia}           # Jolof, Kaabu, Fouta Djallon
  scarcies_head: [-11.1, 9.75]           # Fouta Djallon, Sierra Leone, Mali (the Niger's source)
  mano_head: [-10.4, 8.9]                # Sierra Leone, Liberia, Mali
  nimba: [-8.15, 8.15]                   # Liberia, Kong, Mali
  volta_tip: {at: [-1.95, 14.0], divide: volta}                # Mali, Kong, Songhai: the Volta basin's northern tip
  tossaye: [-0.35, 17.25]                # Mali, Songhai, Air, north of the Tossaye narrows
  pendjari: {at: [1.55, 11.05], river: Oti}                     # Kong, Tem, Dahomey
  w_park: [2.35, 11.95]                  # Kong, Dahomey, Songhai: the W of the Niger
  gaya: {at: [3.45, 11.9], river: Niger}                        # Songhai, Dahomey, Nigeria
  azawagh: [4.4, 14.95]                  # Songhai, Nigeria, Air
  termit: [10.5, 15.6]                   # Nigeria, Air, Kanem
  lake_chad: [14.1, 13.05]               # Nigeria, Kanem, Cameroon, in the lake
  # the centre
  adamawa: [15.25, 7.3]                  # Cameroon, Kanem, the Central African Republic
  darfur: [22.85, 10.95]                 # Kanem, Sudan, the Central African Republic
  sangha: [16.1, 2.45]                   # Cameroon, DN Kongo, the Central African Republic
  ogooue_head: {at: [13.1, 2.0], divide: ogooue}               # Cameroon, Gabon, DN Kongo
  muni: [11.35, 2.12]                    # Cameroon, Gabon, Equatorial Guinea
  bateke: {at: [14.0, -2.3], divide: ogooue}                   # where Gabon leaves the Ogooue's rim
  ubangi: {at: [18.6, 3.75], river: Ubangi}                     # DN Kongo, Kongo, the Central African Republic
  uele: {at: [27.35, 5.05], divide: congo}                      # Kongo, the CAR, South Sudan: the Nile-Congo divide
  bahr_arab: {at: [24.0, 8.6], divide: congo}                   # the CAR, Sudan, South Sudan
  # the east
  ethiopia_north: [34.45, 10.45]         # Sudan, South Sudan, Ethiopia
  setit: {at: [36.55, 14.3], river: [Setit, Tekezé]}            # Sudan, Eritrea, Ethiopia
  danakil: [42.35, 12.55]                # Eritrea, Ethiopia, Djibouti
  zeila: [43.05, 10.98]                  # Djibouti, Ethiopia, Somaliland
  nugaal: [46.6, 8.1]                    # Somaliland, Ethiopia, Somalia
  dolo: [42.05, 4.2]                     # Ethiopia, Kenya, Somalia
  turkana: [35.8, 4.95]                  # Ethiopia, Kenya, South Sudan
  kidepo: [33.85, 4.2]                   # Kenya, Uganda, South Sudan
  west_nile: [30.8, 3.6]                 # Uganda, Kongo, South Sudan
  virunga: [29.55, -1.38]                # Uganda, Kongo, Rwanda
  rusizi: [28.95, -2.5]                  # Kongo, Rwanda, Burundi
  kagera: [30.8, -2.4]                   # Rwanda, Burundi, Tanzania
  ruk: [30.85, -1.05]                    # Rwanda, Uganda, Tanzania
  victoria: [33.95, -1.0]                # Uganda, Kenya, Tanzania, in the lake
  tanganyika: [29.45, -4.45]             # Kongo, Burundi, Tanzania, in the lake
  tanganyika_south: [30.7, -8.3]         # Kongo, Tanzania, Zambia, in the lake
  # the south
  mafinga: [33.3, -9.6]                  # Zambia, Malawi, Tanzania
  nyasa_east: [34.75, -11.6]             # Malawi, Tanzania, Mozambique, in the lake
  luangwa_mid: {at: [31.3, -14.4], river: Luangwa}             # Zambia, Malawi, Mozambique
  zumbo: {at: [30.42, -15.62], river: Zambezi}                 # Zambia, Zimbabwe, Mozambique
  kazungula: {at: [25.26, -17.8], river: Zambezi}              # Zambia, Zimbabwe, Botswana
  linyanti: {at: [23.3, -18.0], river: [Linyanti, Chobe, Cuando]}  # Zambia, Botswana, Angola
  zambezi_head: {at: [24.1, -11.45], divide: congo}           # Kongo, Zambia, Angola
  dirico: {at: [20.75, -17.95], river: [Cubango, Okavango]}   # Angola, Namibia, Botswana
  twee_rivieren: [20.6, -26.45]          # Namibia, Botswana, Cape Republic
  molopo_east: [25.2, -25.75]            # Botswana, Cape Republic, Xhosa Republic
  shashe: {at: [29.35, -22.2], river: Limpopo}                 # Botswana, Zimbabwe, Xhosa Republic
  pafuri: {at: [31.3, -22.4], river: Limpopo}                  # Zimbabwe, Mozambique, Xhosa Republic
  swazi_north: [31.98, -25.95]           # Eswatini, Mozambique, Xhosa Republic
  swazi_south: [31.95, -27.3]            # Eswatini, Mozambique, Xhosa Republic

frontiers:
  # ---- the north: Iceland, the Faroes, Norway, Sweden, Denmark, Finland ------------------
  - id: morocco-south
    nations: [morocco, algeria/saguia]
    follows: the Moulouya, the east end of the High Atlas, the Tafilalt's edge, then the Draa to the sea
    from: [-2.3, 35.3]
    legs:
      - {river: Moulouya, to: [-4.35, 32.7]}
      - via: [[-4.3, 32.25], [-4.05, 31.75], [-3.9, 31.25], [-4.3, 30.6], [-5.05, 30.05], [-5.65, 29.8],
              [-6.4, 29.5], [-7.3, 29.15], [-8.2, 28.75], draa_saguia, [-9.9, 28.45], [-10.6, 28.55],
              [-11.15, 28.72], [-11.4, 28.85]]
  - id: saguia-algeria
    nations: [saguia, algeria]
    follows: the western rim of the Tindouf basin
    from: draa_saguia
    legs:
      - via: [[-9.15, 28.0], [-9.35, 27.4], [-9.1, 26.9], saguia_corner]
  - id: saguia-mauritania
    nations: [saguia, mauritania]
    follows: the southern watershed of the Saguia el-Hamra, north of the Zemmour
    from: [-14.75, 26.0]
    legs:
      - via: [[-14.3, 26.05], [-13.3, 25.95], [-12.1, 26.1], [-10.8, 26.2], [-9.9, 26.3], saguia_corner]
  - id: mauritania-algeria
    nations: [mauritania, algeria]
    follows: the south-western edge of the Erg Iguidi and the Erg Chech, then El Djouf
    from: saguia_corner
    legs:
      - via: [[-8.4, 25.85], [-7.3, 24.85], [-6.55, 23.65], [-6.05, 22.2], [-5.7, 20.8], [-5.45, 19.6], djouf]
  - id: tunisia-algeria
    nations: [tunisia, algeria]
    follows: the Kroumirie and Tebessa mountains, the Chott el Gharsa, then the northern edge of the Grand Erg Oriental
    from: [8.72, 37.05]
    legs:
      - via: [[8.5, 36.65], [8.35, 36.05], [8.3, 35.4], [7.95, 34.8], [7.6, 34.25], [7.65, 33.6], [8.4, 32.65],
              [9.05, 31.95], tunisia_corner]
  - id: tunisia-libya
    nations: [tunisia, libya]
    follows: the Jeffara plain to the Dahar escarpment
    from: [11.62, 33.3]
    legs:
      - via: [[11.35, 32.8], [10.75, 32.25], [10.1, 31.8], tunisia_corner]
  - id: algeria-libya
    nations: [algeria, libya]
    follows: the eastern edge of the Grand Erg Oriental, the Hamada, and the gap between the Tassili and the Acacus
    from: tunisia_corner
    legs:
      - via: [[9.6, 30.85], [9.3, 30.25], [9.25, 29.5], [9.55, 28.55], [9.85, 27.4], [10.1, 26.3], [9.95, 25.5],
              [10.05, 24.7], [10.6, 23.8], central]
  - id: libya-egypt
    nations: [libya, egypt]
    follows: the Sollum escarpment, then the western edge of the Great Sand Sea to Gilf Kebir and Uweinat
    from: [25.2, 31.75]
    legs:
      - via: [[24.95, 30.9], [24.8, 30.0], [24.95, 29.1], [25.35, 28.1], [25.55, 26.8], [25.3, 25.3], [25.55, 24.0],
              [25.25, 22.7], uweinat]
  - id: egypt-sudan
    nations: [egypt, sudan]
    follows: the Selima sand sheet, the second cataract, then the Wadi Allaqi to Gebel Elba
    from: uweinat
    legs:
      - via: [[26.5, 21.55], [28.2, 21.4], [29.8, 21.6], [31.35, 21.8], [32.3, 21.95], [33.2, 22.35], [34.3, 22.2],
              [35.3, 22.05], [36.25, 22.1], [36.95, 22.1]]
  - id: libya-sudan
    nations: [libya, sudan]
    follows: the Uweinat massif
    from: libya_sudan
    legs:
      - via: [[24.35, 21.45], uweinat]
  - id: libya-kanem
    nations: [libya, kanem]
    follows: the Tummo, the northern foot of the Tibesti, and the Sarir Tibesti
    from: central
    legs:
      - via: [[12.4, 22.95], [13.6, 22.6], [15.4, 22.95], [17.4, 22.55], [19.6, 22.2], [21.6, 21.7], libya_sudan]
  - id: algeria-air
    nations: [algeria, air]
    follows: the south foot of the Tassili du Hoggar
    from: ifoghas
    legs:
      - via: [[1.25, 20.75], [2.3, 21.3], [3.5, 21.0], [5.0, 20.7], [6.5, 20.95], [8.0, 21.6], [9.4, 22.4], central]
  - id: mali-algeria
    nations: [mali, algeria]
    follows: the northern edge of the Azawad
    from: djouf
    legs:
      - via: [[-4.25, 19.1], [-2.75, 19.45], [-1.2, 19.55], [0.2, 19.35], ifoghas]
  - id: mali-mauritania
    nations: [mali, mauritania]
    follows: the Karakoro, the Assaba, and the escarpment of the Tagant, Tichitt, Oualata and Nema above the Hodh
    from: karakoro
    legs:
      - via: [[-12.1, 15.3], [-11.95, 15.8], [-11.7, 16.35], [-11.55, 16.95], [-11.4, 17.5], [-11.0, 17.95], [-10.1, 18.1],
              [-9.2, 18.2], [-8.3, 18.1], [-7.55, 17.75], [-7.1, 17.25], [-6.3, 17.75], djouf]
  - id: jolof-mauritania
    nations: [jolof, mauritania]
    follows: the Senegal
    from: [-16.6, 15.85]
    legs:
      - {river: [Sénégal, Bafing], to: karakoro}
  # ---- the west: Spain, Portugal, Galicia, Italy, France and the duchies --------------------
  - id: jolof-mali
    nations: [jolof, mali]
    follows: the Senegal to Bafoulabe, then the Bafing
    from: karakoro
    legs:
      - {river: [Sénégal, Bafing], to: bafing_fouta}
  - id: jolof-fouta
    nations: [jolof, fouta]
    follows: the northern escarpment of the Fouta Djallon
    from: bafing_fouta
    legs:
      - via: [[-11.55, 12.3], [-12.0, 12.45], gambia_fouta]
  - id: jolof-kaabu
    nations: [jolof, kaabu]
    follows: the Gambia
    from: gambia_fouta
    legs:
      - {river: Gambia, to: [-16.55, 13.5]}
      - via: [[-16.9, 13.5]]
  - id: kaabu-fouta
    nations: [kaabu, fouta]
    follows: the western foot of the Fouta Djallon
    from: gambia_fouta
    legs:
      - via: [[-13.3, 12.1], [-13.75, 11.7], [-14.2, 11.35], [-14.65, 11.1], [-15.2, 10.95]]
  - id: fouta-mali
    nations: [fouta, mali]
    follows: the eastern escarpment of the Fouta Djallon
    from: bafing_fouta
    legs:
      - via: [[-11.2, 11.8], [-11.35, 11.3], [-11.2, 10.8], [-11.35, 10.2], scarcies_head]
  - id: fouta-sierra-leone
    nations: [fouta, sierra_leone]
    follows: the Great Scarcies
    from: [-13.35, 8.85]
    legs:
      - via: [[-12.95, 9.1], [-12.55, 9.55], [-12.1, 9.95], [-11.55, 9.95], scarcies_head]
  - id: sierra-leone-mali
    nations: [sierra_leone, mali]
    follows: the Loma and Kissi highlands, the Niger's first watershed
    from: scarcies_head
    legs:
      - via: [[-10.75, 9.3], mano_head]
  - id: sierra-leone-liberia
    nations: [sierra_leone, liberia]
    follows: the Mano
    from: [-11.55, 6.8]
    legs:
      - via: [[-11.3, 7.1], [-11.0, 7.45], [-10.7, 7.8], [-10.6, 8.35], mano_head]
  - id: liberia-mali
    nations: [liberia, mali]
    follows: the Guinea highlands between Macenta and Nimba
    from: mano_head
    legs:
      - via: [[-9.8, 8.95], [-9.1, 8.75], [-8.5, 8.4], nimba]
  - id: liberia-kong
    nations: [liberia, kong]
    follows: the Cavalla
    from: nimba
    legs:
      - via: [[-8.25, 7.6], [-8.35, 7.0], [-8.1, 6.45], [-7.65, 5.95], [-7.45, 5.35], [-7.52, 4.6], [-7.55, 4.2]]
  - id: mali-kong
    nations: [mali, kong]
    follows: the Niger-Volta watershed, the Banfora cliff, then the Niger's southern rim
    from: volta_tip
    legs:
      - {divide: niger, to: nimba}
  - id: mali-songhai
    nations: [mali, songhai]
    follows: the Tossaye narrows of the Niger, the Gourma and the eastern foot of the Hombori hills
    from: tossaye
    legs:
      - via: [[-0.55, 16.9], [-0.85, 16.3], [-1.25, 15.6], [-1.6, 14.8], volta_tip]
  - id: mali-air
    nations: [mali, air]
    follows: the western foot of the Adrar des Ifoghas
    from: ifoghas
    legs:
      - via: [[0.45, 18.7], [0.05, 17.9], tossaye]
  - id: kong-songhai
    nations: [kong, songhai]
    follows: the Volta-Niger watershed
    from: volta_tip
    legs:
      - {divide: volta, to: w_park}
  - id: kong-dahomey
    nations: [kong, dahomey]
    follows: the Pendjari and the Atakora's northern end
    from: w_park
    legs:
      - via: [[1.95, 11.5], pendjari]
  - id: kong-tem
    nations: [kong, tem]
    follows: the Volta and the Oti
    from: [0.72, 5.6]
    legs:
      - {river: [Volta, Oti], to: pendjari}
  - id: tem-dahomey
    nations: [tem, dahomey]
    follows: the Mono, then the eastern foot of the Atakora
    from: [1.68, 6.15]
    legs:
      - via: [[1.62, 6.9], [1.52, 7.6], [1.55, 8.3], [1.65, 9.0], [1.75, 9.7], [1.95, 10.35], pendjari]
  - id: songhai-dahomey
    nations: [songhai, dahomey]
    follows: the Mekrou, then the Niger
    from: w_park
    legs:
      - via: [[2.6, 12.15]]
      - {river: Niger, to: gaya}
  - id: dahomey-nigeria
    nations: [dahomey, nigeria]
    follows: the Okpara and the Ogun-Oueme watershed
    from: gaya
    legs:
      - via: [[3.6, 11.35], [3.5, 10.6], [3.2, 9.9], [2.95, 9.2], [2.78, 8.4], [2.72, 7.5], [2.72, 6.8], [2.74, 6.2]]
  - id: songhai-nigeria
    nations: [songhai, nigeria]
    follows: the Dallol Maouri
    from: gaya
    legs:
      - via: [[3.72, 12.5], [3.92, 13.3], [4.12, 14.1], azawagh]
  - id: songhai-air
    nations: [songhai, air]
    follows: the southern edge of the Azawagh and the lower Tilemsi
    from: azawagh
    legs:
      - via: [[3.5, 15.5], [2.5, 16.1], [1.3, 16.7], [0.3, 17.05], tossaye]
  - id: nigeria-air
    nations: [nigeria, air]
    follows: the Tiguidit escarpment and the Damergou
    from: azawagh
    legs:
      - via: [[5.3, 15.5], [6.3, 16.2], [7.5, 16.45], [8.8, 16.3], [9.8, 16.0], termit]
  - id: air-kanem
    nations: [air, kanem]
    follows: the Tenere
    from: termit
    legs:
      - via: [[11.0, 16.8], [11.4, 18.2], [11.5, 19.6], [11.3, 21.0], [11.2, 22.2], central]
  - id: nigeria-kanem
    nations: [nigeria, kanem]
    follows: the Manga, then the Komadugu Yobe into Lake Chad
    from: termit
    legs:
      - via: [[11.0, 14.7], [11.6, 13.75], [12.1, 13.3]]
      - {river: Komadugu Yobe, to: [13.3, 13.65]}
      - via: [lake_chad]
  - id: nigeria-cameroon
    nations: [nigeria, cameroon]
    follows: the Cameroon line (the Rumpi, Bamenda and Mambilla highlands, the Alantika and the Mandara crest)
    from: [8.5, 4.4]
    legs:
      - via: [[8.9, 5.1], [9.3, 5.8], [9.9, 6.6], [10.9, 7.2], [11.8, 7.9], [12.5, 8.8], [12.85, 9.4], [13.3, 10.2],
              [13.75, 10.9], [14.1, 11.7], [14.2, 12.4], lake_chad]
  # ---- the centre: Germany, Austria, Bavaria, the Low Countries, Poland ----------------------
  - id: kanem-cameroon
    nations: [kanem, cameroon]
    follows: the Chari and the Logone
    from: lake_chad
    legs:
      - via: [[14.45, 12.95]]
