    follows: the Dar Fertit
    from: darfur
    legs:
      - via: [[23.35, 9.9], bahr_arab]
  - id: cameroon-car
    nations: [cameroon, car]
    follows: the eastern foot of the Adamawa and the Kadei
    from: adamawa
    legs:
