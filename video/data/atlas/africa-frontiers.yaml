      - {river: Bahr Aouk, to: [21.4, 9.6]}
      - via: [[22.2, 10.3], darfur]
  - id: kanem-sudan
    nations: [kanem, sudan]
    follows: the Ennedi's eastern foot, the Wadi Howar's head, and the Dar Masalit
    from: libya_sudan
    legs:
      - via: [[23.3, 19.6], [23.0, 18.2], [22.7, 16.8], [22.5, 15.4], [22.3, 14.1], [22.45, 12.9], [22.75, 11.8], darfur]
  - id: car-sudan
