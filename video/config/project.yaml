# Controglobe video: "Alternate History of Arabia (in place of the United States)", every year.
#
# One file drives the whole pipeline. Everything Claude or you change about the look,
# the pacing or the map frame belongs here, not in the code.

title: "Alternate History of Arabia (in place of the United States)"
subtitle: "Every year, 500 BCE - 2026 | Controglobe: the Global Swap"
watermark: "CONTROGLOBE"

years:
  start: -500          # negative = BCE; there is no year 0 (1 BCE is followed by 1 CE)
  end: 2026

# The encyclopedia draws every Mashriq map on an azimuthal equal-area projection centred
# on 46.5E 25N. The video uses the same one, so a viewer who knows the site knows the map.
projection: "+proj=laea +lat_0=25 +lon_0=46.5 +datum=WGS84 +units=m +no_defs"

frame:
  width: 3840
  height: 2160
  fps: 30
  preview_scale: 0.5   # `build.py preview` renders at this fraction of the full size

view:
  center: [46.0, 26.2] # lon, lat of the frame centre
  height_km: 3500      # ground distance from the bottom to the top of the frame

# Where the province mesh is generated (lon/lat boxes). Land outside is drawn as plain land.
mesh:
  bbox: [20.0, 5.5, 68.0, 44.5]       # west, south, east, north: a margin wider than any polity
  extra_bboxes:
    - [42.8, -13.2, 45.6, -11.1]      # Qumur (Comoros), shown as an inset
  spacing_km: 95                      # default distance between cell seeds
  focus:                              # finer cells where borders matter most
    - {bbox: [30.0, 10.0, 63.0, 42.0], spacing_km: 55}
    - {bbox: [34.0, 12.0, 60.5, 38.0], spacing_km: 38}
    - {bbox: [34.0, 29.0, 49.0, 38.0], spacing_km: 26}   # the Levant and Mesopotamia
    - {bbox: [42.8, -13.2, 45.6, -11.1], spacing_km: 12}
  seed: 1776                          # change it and every cell edge is redrawn
  noise: 0.22                         # edge roughness; 0 gives straight Voronoi edges
  noise_depth: 4                      # midpoint-displacement passes per edge
  min_cell_km2: 120                   # smaller faces are merged into a neighbour
  min_island_km2: 25                  # smaller islands are dropped
  rivers:                             # Natural Earth river names that cut cells and bar regions
    - Euphrates
    - Tigris
    - Jordan
    - Orontes
    - Nile
    - Karun
    - Kura
    - Aras
    - Shatt al Arab
  barrier_penalty: 12                 # how hard a river or custom line is to grow a region across

insets:
  - name: "Qumur"
    bbox: [42.8, -13.2, 45.6, -11.1]  # lon/lat of what the inset shows
    rect: [0.795, 0.09, 0.18, 0.2]     # left, bottom, width, height as fractions of the frame

# Pacing: seconds of screen time per year come from eras.csv; events add dwell time.
pacing:
  dwell_by_importance: {1: 0.6, 2: 1.8, 3: 3.5}   # extra seconds on a year with such an event
  era_title_seconds: 2.5                           # extra hold on the first year of an era
  min_frames_per_year: 1
  target_minutes: null                             # e.g. 18 to rescale the base pacing to a runtime
  caption_seconds: 4.0                             # a caption stays on screen at least this long

style:
  ocean: "#22364a"
  land: "#e9e2cf"             # land nobody holds
  coast: "#101c27"
  coast_width: 1.0
  river: "#4a7ba3"
  river_width: 1.4
  border: "#2e2a26"
  border_width: 1.4           # between top-level polities
  inner_border_width: 0.7     # between states of one union
  territory_lighten: 0.45     # territories are drawn this much lighter than their parent
  label_color: "#1d1b18"
  label_halo: "#ffffff"
  label_min_area_km2: 9000
  sub_label_min_area_km2: 20000
  show_sub_labels: true
  show_places: true
  arabic_labels: false        # needs arabic-reshaper and python-bidi; draws name_ar under the name
  postfx:                     # applied to every frame; 0 turns an effect off
    vignette: 0.35
    grain: 0.012
  hud:
    panel: "#101418"
    panel_alpha: 0.72
    text: "#f4efe6"
    accent: "#e2b659"
    font: null                # path to a .ttf/.otf; null uses DejaVu Sans from matplotlib
    font_bold: null

paths:
  data: data
  cache: cache
  build: build
  output: output
