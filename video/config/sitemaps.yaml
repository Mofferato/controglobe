# The encyclopedia's maps of al-Mashriq, redrawn on the video's borders by `python build.py sitemaps`.
# Written once by --bootstrap from the schematic maps; edit it by hand from now on.
# id: a name; page and map: which map of al-Mashriq on which page (0 is the first; the
#   Arabic edition's page of the same name gets the same ground); frontiers: the year whose
#   frontiers are drawn; inner: solid, dashed or null for the lines between one power's states,
#   colonies or territories; unit: what the fills list (region ids, or mesh cell ids for
#   unit: cell); fills: legend colour -> the regions or cells it covers; keep: colours of the
#   schematic map's own shapes kept above the ground (the energy map's solar arrays);
#   category_lines: white lines between the fill colours; relief and fill_opacity: strengths.
# joined: a map of growth. Each region is shaded by the year it first came under `top`
#   between `from` and `until`, read from the video's data: `years` gives each joining
#   year its legend colour, `regions` overrides a region; `fills` then only adds areas
#   outside the growing power (the Nabataean map's powers beyond the routes).
maps:
- id: physical
  page: united-states-of-arabia.html
  map: 0
  unit: cell
  frontiers: 2026
  inner: null
  relief: 0.8
  fill_opacity: 0.72
  fills:
