  - ["300 BCE", "The Fire-Keepers rule the eastern woods from the Great Bottom"]
  - ["250 BCE", "The Great Houses of the San Juan become a kingdom"]
  - ["200 BCE", "The mound cities of the Neches form the Caddo League"]
  - ["150 BCE", "The City of the Gods rises in the Valley of Mexico"]
  - ["26 BCE", "The Northern Expedition marches on the canal lands"]
  - ["24 BCE", "The Northern Expedition comes home: 3,900 of 11,500"]
  - ["40", "The first inscription in the Turquoise syllabary, on a shell"]
  - ["70", "The lake city of the Nahua falls to the City of the Gods"]
  - ["106", "The Great Houses become a client of the City"]
  - ["150", "Paquimé is founded at the meeting of the roads"]
  - ["224", "The Fire-Keepers revive under a new house"]
  - ["268", "The Turquoise Queen breaks with the City"]
  - ["273", "Chaco falls; the Turquoise Queen is taken on the road east"]
  - ["300", "The Caddo League becomes the Fire-Keepers' client"]
