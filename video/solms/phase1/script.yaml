# Phase I: The Turquoise Road (500 BCE - 603 CE). The cut, scene by scene.
#
# Times (t) are seconds from the scene's start. Dates are "26 BCE", "272", "363-05-29" or
# "26 BCE-03" (BCE years are written as such; there is no year 0). Places are lon, lat.
# camera: [t, lon, lat, span_km, tilt_deg, heading_deg]: span is the ground height the frame shows
#   looking straight down; tilt leans the camera toward the horizon; heading turns it.
# clock: [t, date] keys; the map, the infobox and the date counter follow it.
# date: how the counter reads (year | season | month | day | none).
# lines: what the cast say: [t, who, mood, text] (+ dur, at: [lon, lat] to stand by a place).
# Every name, battle and number not on the pages is in canon.md as a proposal.

title: "Alternate History of Texas (in place of Saudi Arabia)"
subtitle: "Kingdom of Solms-America · Phase I: The Turquoise Road · 500 BCE – 603 CE"
skin: marble
fps: 30
size: [1920, 1080]
discord: https://discord.gg/XYZXVFjQUj
era: {en: "Antiquity · The Turquoise Road", de: "Altertum · Der Türkisweg", ar: "العصور القديمة · درب الفيروز"}

# the Turquoise Road and its branches: from (date) the road is drawn, growing over `grow` seconds
