    lines:
      - [9.2, solms, neutral, "Texas, in the role of Saudi Arabia. Same ground.", {dur: 3.6}]
      - [13.0, solms, smug, "Dreifurt is my Riyadh. Paquimé, my Makkah.", {dur: 3.8}]
      - [17.0, solms, happy, "Every name in four tongues. Do keep up.", {dur: 4.2}]

