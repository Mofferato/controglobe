    camera: [[0, -102, 31, 1900, 0, 0], [13.5, -102, 31, 1900, 0, 0], [20, -101.5, 31.2, 1800, 20, 0]]
    map: modern
    cards:
      - {t: 2.0, dur: 9.5, kind: title}
    lines:
      - [6.5, solms, smug, "This is my land. Well. It will be.", {dur: 3.4}]
      - [13.8, solms, neutral, "Before the oil. Before the crown. Before me…", {dur: 3.3}]
      - [17.2, solms, happy, "…there was the Road.", {dur: 2.8}]

  # ---------------------------------------------------------------- 0:20 premise
  - id: premise
    chapter: "Texas in the role of Saudi Arabia"
    dur: 22
    date: none
    clock: [[0, "2026"]]
