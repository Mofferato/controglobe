  - ["363", "The Eastern Expedition reaches the Great Bottom"]
  - ["410", "The City gives up the Great Houses and the lake city"]
  - ["525", "The City conquers the Canal League"]
  - ["554", "The Caprock: the Caddo king falls"]
  - ["570", "The Year of the Litter; the Great Headgate breaks"]
  - ["598", "The City of the Gods burns"]

scenes:

  # ---------------------------------------------------------------- 0:00 cold open
  - id: open
    chapter: "Cold open"
    dur: 20
    date: none
    clip: {src: clips/globe_open.mp4, t0: 0, t1: 13.5, fade: 1.2}
