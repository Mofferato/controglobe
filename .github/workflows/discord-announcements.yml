# Posts each new upload on the Controglobe YouTube channel to the Discord's #announcements, and
# posts a message by hand from Actions > Discord announcements > Run workflow (the GitHub app too).
# Setup and settings: community/README.md, "Announcing new videos by itself".
name: Discord announcements

on:
  schedule:
    - cron: "7,37 * * * *"         # every half hour
  workflow_dispatch:
    inputs:
      message:
        description: "Message to post in #announcements. Leave empty to only check YouTube for new uploads (posts nothing if there are none). \\n makes a new line."
        required: false
        default: ""
      ping:
        description: "Ping the Video Pings role with the message"
        type: boolean
        default: false
      repost_latest:
        description: "Post the channel's latest video again (a test, or a re-announcement)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-announcements
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: community

      - name: Restore the list of videos already announced
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: .announced.json
          key: announced-${{ github.run_id }}
          restore-keys: announced-

      - name: Announce
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          DISCORD_PING_ROLE: ${{ vars.DISCORD_PING_ROLE }}
          MESSAGE: ${{ inputs.message }}
          PING: ${{ inputs.ping }}
          REPOST: ${{ inputs.repost_latest }}
        run: |
          if [ -n "$MESSAGE" ]; then
            if [ "$PING" = "true" ]; then
              python community/announce.py --message "$MESSAGE" --ping
            else
              python community/announce.py --message "$MESSAGE"
            fi
          elif [ "$REPOST" = "true" ]; then
            python community/announce.py --state .announced.json --repost-latest
          else
            python community/announce.py --state .announced.json
          fi

      - name: Keep the list for the next run
        # only when the list changed: saving an unchanged list under its old name just warns
        if: always() && hashFiles('.announced.json') != '' && steps.restore.outputs.cache-matched-key != format('announced-{0}', hashFiles('.announced.json'))
        uses: actions/cache/save@v5
        with:
          path: .announced.json
          key: announced-${{ hashFiles('.announced.json') }}
